[project]
name = "ga4-ecommerce-analytics-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LilyFae", email = "andrew.patton@ucalgary.ca" }
]
requires-python = ">=3.13"
dependencies = [
    "google-cloud==0.34.0",
    "google-cloud-bigquery>=3.46.2",
    "google-cloud-bigquery-storage>=2.43.0",
    "hvplot==0.12.2",
    "matplotlib==3.11.2",
    "networkx==3.6.1",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "polars==1.44.2",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "python-dotenv==1.2.4",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "seaborn==0.13.2",
    "statsmodels==0.15.0",
]

[project.scripts]
ga4-ecommerce-analytics-engine = "ga4_ecommerce_analytics_engine:main"
ga4-pipeline = "ga4_ecommerce_analytics_engine.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
preview-features = ["malware-check"]
exclude-newer = "7 days"
